gradle.projectsEvaluated {
  def nativeProject = gradle.rootProject.findProject(':chatstamp-native')
  if (nativeProject == null) return

  nativeProject.tasks.register('prepareChatStampConnectedRunner') {
    doLast {
      def runnerConfigurations = nativeProject.configurations.findAll {
        it.canBeResolved && it.name.startsWith('_internal-unified-test-platform')
      }
      if (runnerConfigurations.isEmpty()) {
        throw new GradleException('No Android connected-runner configurations')
      }
      runnerConfigurations.each { configuration ->
        def artifacts = configuration.resolve()
        println "Resolved ${configuration.name}: ${artifacts.size()} artifacts"
      }
    }
  }
}
